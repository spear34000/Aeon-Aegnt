name: Sync repository labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/issue-management.cjs
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { syncLabels } = require('./.github/scripts/issue-management.cjs');
            await syncLabels({ github, context });
