name: Release

# Builds the Android app, the desktop installers and the web app, and for a tag such as v1.2.3 puts them in a DRAFT release
# that the owner reads and publishes. See docs/RELEASING.md for the secrets, the approval step and what is not covered.
#
# - A tag `v*` runs the tests (the CI workflow), builds everything and, after the owner approves the `release` environment,
#   creates the draft release. Only repository admins can create such a tag (a tag ruleset).
# - A pull request that changes this file builds everything once and releases nothing, so the workflow is tested before it is used.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        # The tag name is untrusted text: it is read from the environment, checked against a pattern, and only then used.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then raw="${REF_NAME#v}"; else raw="0.1.0-test"; fi
          if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "The tag must look like v1.2.3 or v1.2.3-rc1" >&2
            exit 1
          fi
          numeric="${raw%%-*}"
          IFS=. read -r major minor patch <<< "$numeric"
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          if [ "$raw" != "$numeric" ] || [ "$major" = 0 ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  tests:
    name: Tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  android:
    name: Android (debug key)
    needs: [version, tests]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Node.js for Mobile (the agent that runs on the phone)
        run: node tools/fetch-nodejs-mobile.mjs
      - name: Android SDK pieces the build asks for
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "ndk;29.0.14206865"'
      - name: Build (debug key, installable for testing)
        working-directory: ui
        run: bash ./gradlew :androidApp:assembleDebug -PappVersion=${{ needs.version.outputs.numeric }} -PappVersionName=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }} --console=plain
      - name: Name the file
        run: cp ui/androidApp/build/outputs/apk/debug/androidApp-debug.apk "aeon-${{ needs.version.outputs.version }}-android-debug-key.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-key
          path: aeon-*-android-debug-key.apk
          if-no-files-found: error

  android-signed:
    name: Android (signed with the release key)
    needs: [version, tests]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.version.result == 'success' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The signing key lives only in this environment, and the owner has to approve each use of it.
    environment: release
    steps:
      - name: Is the signing key set up?
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::warning::No signing key (ANDROID_KEYSTORE_BASE64 in the release environment): the release gets only the debug-key APK. See docs/RELEASING.md."; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.have == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.have == 'true'
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        if: steps.key.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.have == 'true'
      - name: Node.js for Mobile
        if: steps.key.outputs.have == 'true'
        run: node tools/fetch-nodejs-mobile.mjs
      - name: Android SDK pieces the build asks for
        if: steps.key.outputs.have == 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "ndk;29.0.14206865"'
      - name: Build and sign
        if: steps.key.outputs.have == 'true'
        working-directory: ui
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AEON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AEON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AEON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export AEON_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          bash ./gradlew :androidApp:assembleRelease -PappVersion=${{ needs.version.outputs.numeric }} -PappVersionName=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }} --console=plain
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signature and name the file
        if: steps.key.outputs.have == 'true'
        run: |
          apk=$(ls ui/androidApp/build/outputs/apk/release/*.apk | head -1)
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs "$apk"
          cp "$apk" "aeon-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: android-signed
          path: aeon-*-android.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [version, tests]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":composeApp:packageMsi :composeApp:packageExe"
            files: "ui/composeApp/build/compose/binaries/main/msi/*.msi ui/composeApp/build/compose/binaries/main/exe/*.exe"
          - os: ubuntu-latest
            tasks: ":composeApp:packageDeb"
            files: "ui/composeApp/build/compose/binaries/main/deb/*.deb"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installers
        working-directory: ui
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PappVersion=${{ needs.version.outputs.numeric }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  web:
    name: Web app
    needs: [version, tests]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ui
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --console=plain
      - name: Zip (the server serves it with --web)
        run: |
          cd ui/composeApp/build/dist/wasmJs/productionExecutable
          zip -qr "$GITHUB_WORKSPACE/aeon-${{ needs.version.outputs.version }}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: aeon-*-web.zip
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [version, android, android-signed, desktop, web]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.android.result == 'success' && needs.desktop.result == 'success' && needs.web.result == 'success' && (needs.android-signed.result == 'success' || needs.android-signed.result == 'skipped') }}
    runs-on: ubuntu-latest
    # No approval step here: only admins can create the tag, the signing already waited for the owner, and the release is a draft.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # When a signed APK exists the debug-key one is left out: two APKs of one version would only confuse.
          if ls aeon-*-android.apk >/dev/null 2>&1; then rm -f aeon-*-android-debug-key.apk; fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Aeon $VERSION" $flags
